# BloodKeeper — despliegue de producción construido desde el checkout local
# Generado a partir del contrato de compose.yaml. No contiene secretos ni datos.
services:

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.release

    init: true
    user: "101:101"
    security_opt:
      - no-new-privileges:true

    ports:
      - "${BLOODKEEPER_WEB_PORT:-5173}:5173"
    networks:
      - application

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1:5173"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.release

    init: true
    user: "node"

    security_opt:
      - no-new-privileges:true

    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL es obligatoria; defínela en .env}

    volumes:
      - type: volume
        source: backup_status
        target: /run/bloodkeeper-backup
        read_only: true
      - type: volume
        source: backup_requests
        target: /run/bloodkeeper-backup-requests
        read_only: false

    ports:
      - "127.0.0.1:${BLOODKEEPER_API_PORT:-3000}:3000"
    networks:
      - application

    depends_on:
      backup-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1:3000/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
  backup-init:
    image: alpine:3.22
    user: "0:0"
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    command:
      - sh
      - -c
      - >-
        mkdir -p /status /requests /backups &&
        chown 1000:1000 /status /requests /backups &&
        chmod 0750 /status &&
        chmod 0700 /requests /backups
    volumes:
      - backup_status:/status
      - backup_requests:/requests
      - backup_archives:/backups
    restart: "no"

  backup-worker:
    build:
      context: .
      dockerfile: apps/backup/Dockerfile
    init: true
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB es obligatoria; definela en .env}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER es obligatoria; definela en .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatoria; definela en .env}
      BACKUP_KEEP: ${BLOODKEEPER_BACKUP_KEEP:-7}
    volumes:
      - backup_status:/status
      - backup_requests:/requests
      - backup_archives:/backups
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    networks:
      - application
    depends_on:
      backup-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/backup-worker.ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    image: postgres:17-alpine


    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB es obligatoria; defínela en .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER es obligatoria; defínela en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatoria; defínela en .env}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - application

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER es obligatoria; defínela en .env} -d ${POSTGRES_DB:?POSTGRES_DB es obligatoria; defínela en .env}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
volumes:
  postgres_data:
  backup_status:
  backup_requests:
  backup_archives:

networks:
  application:
    driver: bridge
