name: Publish BloodKeeper images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify release builds
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Build API test stage
        run: docker build --target build --file apps/api/Dockerfile.release --tag bloodkeeper-api-verify .

      - name: Test API
        run: >-
          docker run --rm
          --env DATABASE_URL=postgresql://bloodkeeper:validation@postgres:5432/bloodkeeper?schema=public
          bloodkeeper-api-verify npm test

      - name: Audit API dependencies
        run: docker run --rm bloodkeeper-api-verify npm audit --audit-level=high

      - name: Build Web test stage
        run: docker build --target build --file apps/web/Dockerfile.release --tag bloodkeeper-web-verify .

      - name: Test Web
        run: docker run --rm bloodkeeper-web-verify npm test

      - name: Audit Web dependencies
        run: docker run --rm bloodkeeper-web-verify npm audit --audit-level=high

      - name: Validate backup image
        run: docker build --file apps/backup/Dockerfile --tag bloodkeeper-backup-verify .

  publish:
    name: Publish ${{ matrix.name }}
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            image: bloodkeeper-api
            dockerfile: apps/api/Dockerfile.release
          - name: web
            image: bloodkeeper-web
            dockerfile: apps/web/Dockerfile.release
          - name: backup
            image: bloodkeeper-backup
            dockerfile: apps/backup/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/trombosislab/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and publish image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true
