services:

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile

    container_name: v5r-web
    init: true
    user: "node"

    security_opt:
      - no-new-privileges:true

    ports:
      - "5173:5173"

    networks:
      - application

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1:5173"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile

    container_name: v5r-api
    init: true
    user: "node"

    security_opt:
      - no-new-privileges:true

    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}

    ports:
      - "3000:3000"

    networks:
      - application

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1:3000/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    restart: unless-stopped

  postgres:
    image: postgres:17-alpine

    container_name: v5r-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - application

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

volumes:
  postgres_data:

networks:
  application:
    driver: bridge
