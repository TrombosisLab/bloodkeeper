services:

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile

    container_name: v5r-web
    init: true
    user: "node"

    security_opt:
      - no-new-privileges:true

    ports:
      - "5173:5173"

    networks:
      - application

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1:5173"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile

    container_name: v5r-api
    init: true
    user: "node"

    security_opt:
      - no-new-privileges:true

    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL es obligatoria; defínela en .env}

    volumes:
      - type: volume
        source: backup_status
        target: /run/bloodkeeper-backup
        read_only: true
      - type: volume
        source: backup_requests
        target: /run/bloodkeeper-backup-requests
        read_only: false

    ports:
      - "127.0.0.1:3000:3000"

    networks:
      - application

    depends_on:
      backup-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1:3000/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
  backup-init:
    image: alpine:3.22
    container_name: v5r-backup-init
    user: "0:0"
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    command:
      - sh
      - -c
      - >-
        mkdir -p /status /requests /backups &&
        chown 1000:1000 /status /requests /backups &&
        chmod 0750 /status &&
        chmod 0700 /requests /backups
    volumes:
      - backup_status:/status
      - backup_requests:/requests
      - backup_archives:/backups
    restart: "no"

  backup-worker:
    build:
      context: .
      dockerfile: apps/backup/Dockerfile
    container_name: v5r-backup-worker
    init: true
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB es obligatoria; definela en .env}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER es obligatoria; definela en .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatoria; definela en .env}
      BACKUP_KEEP: ${BLOODKEEPER_BACKUP_KEEP:-7}
    volumes:
      - backup_status:/status
      - backup_requests:/requests
      - backup_archives:/backups
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    networks:
      - application
    depends_on:
      backup-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/backup-worker.ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backup-scheduler:
    container_name: v5r-backup-scheduler
    build:
      context: .
      dockerfile: apps/backup/scheduler.Dockerfile
    init: true
    user: "1000:1000"
    read_only: true
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      BACKUP_REQUEST_DIR: /requests
      BACKUP_SCHEDULE_HOUR: ${BLOODKEEPER_BACKUP_SCHEDULE_HOUR:-3}
      BACKUP_SCHEDULE_MINUTE: ${BLOODKEEPER_BACKUP_SCHEDULE_MINUTE:-0}
    volumes:
      - backup_requests:/requests
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=4m
    depends_on:
      backup-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/backup-scheduler.ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  postgres:
    image: postgres:17-alpine

    container_name: v5r-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB es obligatoria; defínela en .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER es obligatoria; defínela en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatoria; defínela en .env}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - application

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER es obligatoria; defínela en .env} -d ${POSTGRES_DB:?POSTGRES_DB es obligatoria; defínela en .env}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
volumes:
  postgres_data:
  backup_status:
  backup_requests:
  backup_archives:

networks:
  application:
    driver: bridge
